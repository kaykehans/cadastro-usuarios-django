{% extends 'usuarios/base.html' %} <!--Herda a estrutura do base.html-->
{% block title %}Login - cadastre-me{% endblock%} <!--Sobrescreve o titulo-->

{% block conteudo %} 

<div class="row justify-content-center mt-5">
   <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="text-center mb-4">Acesse sua Conta</h3>
        
        <!--Formulário de Login Seguro Com Post + CSRF token-->
        <form method="POST">
          {% csrf_token %}

        <!--Nome-->
         <div class="mb-3">
          <label label for="nome" class="form-label">Nome</label>
          <input type="text" class="form-control" id="nome" name="nome" placeholder="Seu Nome" required>
         </div>
         <!--Email-->    
          <div class="mb-3">
            <label label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Seu Email" required>
          </div>
        <!--Senha-->
          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
             <input type="password" class="form-control" id="senha" name="senha" placeholder="Sua Senha" required>
          </div>
          <!--Botao de Cadastro (POST)-->
          <button type="submit" class="btn btn-primary w-100">Fazer Cadastro</button>

          <!--Botao para ir para lista (POST)-->
          <a href="{% url 'listar_usuarios' %} " class="btn btn-secondary w-100 mt-2">Ver Lista de Usuarios</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
